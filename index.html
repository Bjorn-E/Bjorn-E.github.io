<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear with me</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Menu icons (line style, drawn in currentColor so they follow the menu colour). -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="i-mywork" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7" r="3.5"/><path d="M2.5 20.5c0-3.6 2.9-6.5 6.5-6.5 1.5 0 2.9.5 4 1.3"/><path d="M14.5 18.5l2.3 2.3 4.7-5"/>
    </g>
    <g id="i-tasks" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.4 1.4L7.5 4.8M3.5 12l1.4 1.4 2.6-2.6M3.5 18l1.4 1.4 2.6-2.6"/>
    </g>
    <g id="i-board" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/><path d="M5.2 8h1.6M11.2 8h1.6M11.2 11.5h1.6M17.2 8h1.6"/>
    </g>
    <g id="i-alloc" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 13.5l2.6-8A2 2 0 0 1 7.5 4h9a2 2 0 0 1 1.9 1.5l2.6 8V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/><path d="M12 7v5.5M9.8 10.3L12 12.5l2.2-2.2"/>
    </g>
    <g id="i-wbs" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5v4.5M5.5 16.5V12h13v4.5"/>
    </g>
    <g id="i-overview" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="M7.5 17v-4M11.5 17V9M15.5 17v-6M19.5 17V6"/>
    </g>
    <g id="i-projects" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </g>
    <g id="i-people" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3.2"/><path d="M3 20.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.2c2.5 0 4.5 2 4.5 4.6"/>
    </g>
    <g id="i-data" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>
    </g>
  </defs>
</svg>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/home" title="Bear with me – My work">
      <img class="brand-logo" src="img/logo.svg" alt="">
      <span class="brand-name"><span class="brand-bear">Bear</span> with me</span>
    </a>
    <div class="topbar-right">
      <span id="sync-status" class="muted"></span>
      <button id="btn-refresh" class="btn btn-ghost" title="Check for changes from other users" hidden>Refresh</button>
      <span id="current-user"></span>
    </div>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" hidden>
      <label class="field-label" for="project-select">Project</label>
      <select id="project-select"></select>
      <a href="#/home" data-nav="home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mywork"/></svg><span>My work</span></a>
      <a href="#/tasks" data-nav="tasks"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tasks"/></svg><span>Tasks</span></a>
      <a href="#/board" data-nav="board"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-board"/></svg><span>Board</span></a>
      <a href="#/allocation" data-nav="allocation"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-alloc"/></svg><span>Allocation</span></a>
      <a href="#/wbs" data-nav="wbs"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wbs"/></svg><span>WBS diagram</span></a>
      <a href="#/overview" data-nav="overview"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-overview"/></svg><span>Overview</span></a>
      <a href="#/projects" data-nav="projects"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-projects"/></svg><span>Projects</span></a>
      <a href="#/people" data-nav="people"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-people"/></svg><span>People</span></a>
      <a href="#/settings" data-nav="settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-data"/></svg><span>Data folder</span></a>
    </nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="js/config.js"></script>
<script src="js/zip.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/xlsxread.js"></script>
<script src="js/store.js"></script>
<script src="js/docx.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
<script src="js/allocation.js"></script>
<script src="js/taskimport.js"></script>
</body>
</html>
